packages:
  - "packages/*"
  - "examples/*"
overrides:
  # parse5-parser-stream@8.1.0 declares parse5 ^8.0.0 but needs the 8.1.0 tokenizer (flushCharacters),
  # which jsdom 31 calls. Without this, pnpm can resolve it to 8.0.1 and `new JSDOM()` throws.
  "parse5-parser-stream>parse5": 8.1.0
allowBuilds:
  '@parcel/watcher': true
  "@swc/core": true
  core-js: true
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260906.1 || 5.20261023.1 || 5.20261103.1 || 5.20261106.1 || 5.20261108.1'
  - cf@1.0.0-beta.19 || 1.0.0-beta.28
  - miniflare@5.20261019.1-beta || 5.20261019.2-beta || 5.20261103.0-beta || 5.20261104.0-beta
  - wrangler@4.151.3 || 4.152.0 || 4.157.0 || 4.158.0
